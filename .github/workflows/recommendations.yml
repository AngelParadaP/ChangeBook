name: Generate Recommendation Vectors

on:
  # Run when pushed to main (activates on publish)
  push:
    branches: [main]

  # Daily at 00:00 Guadalajara, Mexico (CST = UTC-6 → 06:00 UTC)
  # Note: During DST (April-October), this runs at 01:00 local time.
  # If you need exact midnight during DST, change to '0 5 * * *'
  schedule:
    - cron: '0 6 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  generate-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run recommendation vector generation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/recommendations.py
